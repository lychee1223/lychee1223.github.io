name: Build, check, and deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          check-latest: true
          cache: npm
      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('.nvmrc', 'package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json', 'tailwind.config.ts', 'postcss.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('.nvmrc', 'package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Build static site
        run: npm run build
      - name: Install link checker
        env:
          LYCHEE_VERSION: v0.24.2
        run: |
          tool_dir="$RUNNER_TEMP/lychee"
          archive="lychee-x86_64-unknown-linux-musl.tar.gz"
          release_url="https://github.com/lycheeverse/lychee/releases/download/lychee-$LYCHEE_VERSION"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 "$release_url/$archive" --output "$archive"
          curl --fail --silent --show-error --location --retry 3 "$release_url/$archive.sha256" --output "$archive.sha256"
          sha256sum --check "$archive.sha256"
          tar -xzf "$archive" --strip-components=1
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Test link checker
        run: npm run test:links
      - name: Prepare reports
        run: mkdir -p reports
      - name: Check internal links and anchors
        run: npm run links:check -- --format markdown --output reports/internal-links.md
      - name: Check external links
        id: external-links
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run links:external -- --format markdown --output reports/external-links.md
      - name: Warn about external link failures
        if: steps.external-links.outcome == 'failure'
        run: echo "::warning title=External links::Some external links could not be verified. See the job summary and link-check-reports artifact. Deployment is allowed to continue."
      - name: Summarize link checks
        if: always()
        run: |
          for report in reports/*-links.md; do
            if [ -f "$report" ]; then
              printf '\n## %s\n\n' "$(basename "$report" .md)" >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload link reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: link-check-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
